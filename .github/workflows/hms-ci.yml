name: Aduraking HMS CI

on:
  push:
    paths: ["hms/**", ".github/workflows/hms-ci.yml"]
  pull_request:
    paths: ["hms/**", ".github/workflows/hms-ci.yml"]

defaults:
  run:
    working-directory: hms

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_ci_password
          POSTGRES_DB: hms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hms:hms_ci_password@localhost:5432/hms
      TEST_DATABASE_URL: postgresql://hms:hms_ci_password@localhost:5432/hms_test
      APP_URL: http://localhost:3100
      MFA_ENFORCE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hms/package-lock.json
      - name: Generate CI-only keys
        run: |
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: PGPASSWORD=hms_ci_password psql -h localhost -U hms -d hms -c "CREATE DATABASE hms_test"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - name: Permissions matrix is up to date
        run: npm run -s docs:permissions && git diff --exit-code docs/PERMISSIONS_MATRIX.md
      - run: npm test
      - run: npm run test:integration
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency audit (runtime, report only)
        run: npm audit --omit=dev || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: hms/test-results
