<div style="background:#FFF8EE;padding:32px 16px;font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#14213D">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #F0E4D3;border-radius:16px;padding:28px 24px">
    <p style="margin:0 0 20px;font-size:22px;font-weight:800">
      <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#FF8A1F;margin-right:8px"></span>Pinga
    </p>
    <h1 style="margin:0 0 8px;font-size:22px;font-weight:800">Your sign-up code</h1>
    <p style="margin:0 0 20px;font-size:16px;color:#5B6478">Type this code into Pinga to confirm your email and set up your business.</p>
    <p style="margin:0 0 20px;font-size:36px;font-weight:800;letter-spacing:8px;text-align:center;background:#FFE8D1;border-radius:12px;padding:16px 8px">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:14px;color:#5B6478">The code works for 1 hour. If you didn't sign up for Pinga, you can ignore this email.</p>
  </div>
</div>
